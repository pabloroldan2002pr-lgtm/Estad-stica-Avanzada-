name: Actualizar datos

# Solo se ejecuta cuando se lanza a mano: botón «Actualizar datos» de la web
# o GitHub › Actions › Actualizar datos › Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer BueStats, actas FEB y Copa, y generar la web
        run: python actualizar.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "actualizador"
          git config user.email "actualizador@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Datos actualizados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
